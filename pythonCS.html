<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Java Developer's Python & AI/ML Interview Cheatsheet</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-tomorrow.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      /* Dark Theme (Default) */
      --bg-primary: #090d16;
      --bg-secondary: #0f172a;
      --bg-tertiary: #1e293b;
      --border: rgba(255, 255, 255, 0.08);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      
      --accent-violet: #8b5cf6;
      --accent-pink: #ec4899;
      --accent-gradient: linear-gradient(135deg, #8b5cf6, #ec4899);
      
      --sidebar-width: 320px;
      --sidebar-collapsed-width: 70px;
      --transition-speed: 0.25s;
    }
    
    .light-theme {
      /* Light Theme */
      --bg-primary: #f8fafc;
      --bg-secondary: #ffffff;
      --bg-tertiary: #f1f5f9;
      --border: rgba(0, 0, 0, 0.08);
      --text-primary: #0f172a;
      --text-secondary: #475569;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      height: 100vh;
      display: flex;
      overflow: hidden;
      transition: background-color var(--transition-speed), color var(--transition-speed);
    }
    
    /* App Layout */
    .sidebar {
      width: var(--sidebar-width);
      height: 100%;
      background-color: var(--bg-secondary);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      transition: width var(--transition-speed);
      flex-shrink: 0;
      z-index: 10;
    }
    
    .sidebar.collapsed {
      width: var(--sidebar-collapsed-width);
    }
    
    .main-container {
      flex-grow: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background-color: var(--bg-primary);
    }
    
    /* Sidebar Headers */
    .sidebar-header {
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }
    
    .sidebar.collapsed .sidebar-header {
      padding: 20px 10px;
      justify-content: center;
    }
    
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }
    
    .brand-logo {
      width: 28px;
      height: 28px;
      background: var(--accent-gradient);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 700;
      font-size: 0.9rem;
      flex-shrink: 0;
    }
    
    .brand-name {
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      font-size: 1.05rem;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      white-space: nowrap;
      overflow: hidden;
    }
    
    .sidebar.collapsed .brand-name {
      display: none;
    }
    
    /* Search Bar */
    .search-area {
      padding: 15px 20px 5px 20px;
      position: relative;
    }
    
    .sidebar.collapsed .search-area {
      display: none;
    }
    
    .search-input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }
    
    .search-icon {
      position: absolute;
      left: 12px;
      color: var(--text-secondary);
      font-size: 0.85rem;
      pointer-events: none;
    }
    
    .search-input {
      width: 100%;
      padding: 9px 12px 9px 34px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-size: 0.85rem;
      outline: none;
      transition: border-color 0.2s;
    }
    
    .search-input:focus {
      border-color: var(--accent-violet);
    }
    
    /* Nav List */
    .nav-list {
      list-style: none;
      padding: 10px 0;
      margin: 0;
      overflow-y: auto;
      flex-grow: 1;
    }
    
    .nav-item {
      padding: 12px 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--text-secondary);
      font-size: 0.86rem;
      font-weight: 500;
      transition: background-color 0.15s, color 0.15s;
      border-left: 3px solid transparent;
    }
    
    .sidebar.collapsed .nav-item {
      padding: 14px 0;
      justify-content: center;
    }
    
    .nav-item:hover {
      background-color: rgba(255, 255, 255, 0.02);
      color: var(--text-primary);
    }
    
    .light-theme .nav-item:hover {
      background-color: rgba(0, 0, 0, 0.02);
    }
    
    .nav-item.active {
      color: var(--accent-violet);
      background-color: rgba(139, 92, 246, 0.08);
      border-left-color: var(--accent-violet);
      font-weight: 600;
    }
    
    .light-theme .nav-item.active {
      background-color: rgba(139, 92, 246, 0.05);
    }
    
    .nav-icon {
      font-size: 0.95rem;
      width: 20px;
      text-align: center;
      flex-shrink: 0;
    }
    
    .nav-text {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    .sidebar.collapsed .nav-text {
      display: none;
    }
    
    /* Sidebar Footer */
    .sidebar-footer {
      padding: 15px 20px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    
    .sidebar.collapsed .sidebar-footer {
      padding: 15px 0;
      flex-direction: column;
      gap: 15px;
    }
    
    .footer-action-btn {
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 1.05rem;
      padding: 6px;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s, color 0.2s;
    }
    
    .footer-action-btn:hover {
      background-color: var(--bg-tertiary);
      color: var(--text-primary);
    }
    
    /* Main Content Headers */
    .main-header {
      padding: 18px 40px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: var(--bg-secondary);
      z-index: 5;
    }
    
    .section-title-wrapper {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    
    .section-subtitle {
      font-size: 0.78rem;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    
    .section-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.35rem;
      font-weight: 700;
    }
    
    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    /* Buttons */
    .btn {
      background: var(--accent-gradient);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: opacity 0.2s, transform 0.1s;
      box-shadow: 0 4px 12px rgba(139, 92, 246, 0.2);
    }
    
    .btn:hover {
      opacity: 0.9;
    }
    
    .btn:active {
      transform: scale(0.98);
    }
    
    .btn-outline {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-primary);
      box-shadow: none;
    }
    
    .btn-outline:hover {
      background-color: var(--bg-tertiary);
    }
    
    .btn-outline.active {
      border-color: var(--accent-violet);
      color: var(--accent-violet);
      background-color: rgba(139, 92, 246, 0.06);
    }
    
    /* Content Area Scrollable */
    .content-viewport {
      flex-grow: 1;
      padding: 40px 60px;
      overflow-y: auto;
      scroll-behavior: smooth;
    }
    
    .content-body {
      max-width: 860px;
      margin: 0 auto;
      line-height: 1.75;
      font-size: 0.98rem;
    }
    
    /* Markdown Element Styling */
    .content-body h1, 
    .content-body h2, 
    .content-body h3, 
    .content-body h4 {
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      margin-top: 2em;
      margin-bottom: 0.8em;
      letter-spacing: -0.015em;
    }
    
    .content-body h1 {
      font-size: 2.2rem;
      margin-top: 0;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    
    .content-body h2 {
      font-size: 1.55rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
      margin-top: 1.8em;
    }
    
    .content-body h3 {
      font-size: 1.22rem;
      margin-top: 1.5em;
    }
    
    .content-body p {
      margin-bottom: 1.3em;
    }
    
    .content-body ul, .content-body ol {
      margin-bottom: 1.3em;
      padding-left: 20px;
    }
    
    .content-body li {
      margin-bottom: 0.5em;
    }
    
    .content-body code {
      font-family: 'Fira Code', monospace;
      font-size: 0.85em;
      background-color: var(--bg-tertiary);
      padding: 3px 6px;
      border-radius: 4px;
      color: var(--accent-pink);
    }
    
    .light-theme .content-body code {
      color: #b8226b;
    }
    
    .content-body pre {
      margin: 0;
      padding: 0;
      background: transparent !important;
    }
    
    .content-body pre code {
      background-color: transparent !important;
      padding: 0;
      color: inherit;
      font-size: 0.88rem;
      display: block;
      overflow-x: auto;
    }
    
    /* Custom code container style */
    .code-container {
      margin: 20px 0;
      border-radius: 8px;
      border: 1px solid var(--border);
      background-color: #0d1117;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
    }
    
    .light-theme .code-container {
      background-color: #161b22;
    }
    
    .code-header {
      padding: 8px 16px;
      background-color: rgba(255, 255, 255, 0.03);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .code-lang {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-secondary);
      letter-spacing: 0.05em;
    }
    
    .copy-btn {
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 0.78rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 4px 8px;
      border-radius: 4px;
      transition: background-color 0.2s, color 0.2s;
    }
    
    .copy-btn:hover {
      background-color: rgba(255, 255, 255, 0.05);
      color: var(--text-primary);
    }
    
    /* Code pre formatting overrides */
    .code-container pre {
      padding: 16px !important;
      margin: 0 !important;
      background: transparent !important;
      overflow-x: auto;
    }
    
    /* Alert Boxes */
    blockquote {
      border-left: 4px solid var(--accent-violet);
      padding: 12px 20px;
      background-color: rgba(139, 92, 246, 0.04);
      margin: 20px 0;
      border-radius: 0 8px 8px 0;
      color: var(--text-primary);
    }
    
    blockquote p {
      margin-bottom: 0 !important;
    }
    
    /* Tables Styling */
    .table-wrapper {
      width: 100%;
      overflow-x: auto;
      margin: 25px 0;
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
      text-align: left;
    }
    
    th, td {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
    }
    
    th {
      background-color: rgba(255, 255, 255, 0.02);
      font-weight: 600;
      color: var(--text-primary);
    }
    
    .light-theme th {
      background-color: rgba(0, 0, 0, 0.01);
    }
    
    tr:last-child td {
      border-bottom: none;
    }
    
    /* Viewport Footer Pagination */
    .viewport-footer {
      padding: 20px 40px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: var(--bg-secondary);
      z-index: 5;
    }
    
    /* Collapsible Q&A card box */
    .qa-box {
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 15px;
      background-color: var(--bg-secondary);
      overflow: hidden;
      transition: border-color var(--transition-speed);
    }
    
    .qa-box.expanded {
      border-color: var(--accent-violet);
    }
    
    .qa-question {
      padding: 16px 20px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
      font-size: 0.96rem;
      user-select: none;
    }
    
    .qa-question-content {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-grow: 1;
      padding-right: 15px;
    }
    
    .qa-arrow-icon {
      font-size: 0.85rem;
      color: var(--text-secondary);
      transition: transform var(--transition-speed);
    }
    
    .qa-box.expanded .qa-arrow-icon {
      transform: rotate(90deg);
      color: var(--accent-violet);
    }
    
    .qa-answer {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s cubic-bezier(0, 1, 0, 1), padding 0.15s;
      padding: 0 20px;
      border-top: 1px solid transparent;
      background-color: var(--bg-primary);
    }
    
    .qa-box.expanded .qa-answer {
      max-height: 10000px;
      padding: 20px;
      border-top-color: var(--border);
      transition: max-height 0.3s cubic-bezier(0.5, 0, 1, 0.5), padding 0.15s;
    }
    
    /* Scrollbars customization */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
    }
    
    .light-theme ::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.1);
    }
    
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.2);
    }
    
    .light-theme ::-webkit-scrollbar-thumb:hover {
      background: rgba(0, 0, 0, 0.2);
    }
  </style>
</head>

  <!-- JavaScript Modules -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-core.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
  
  <script>
    // UTF-8 base64 decoder helper
    function decodeBase64Utf8(base64) {
      const binaryString = atob(base64);
      const bytes = new Uint8Array(binaryString.length);
      for (let i = 0; i < binaryString.length; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }
      const decoder = new TextDecoder("utf-8");
      return decoder.decode(bytes);
    }
    
    // Global State
    let rawMarkdown = "";
    let sections = [];
    let activeSectionIndex = 0;
    let interviewMode = false;
    let isCollapsed = false;
    let isDark = true;
    
    // Decode markdown
    try {
      rawMarkdown = decodeBase64Utf8(encodedMarkdown);
    } catch(err) {
      document.getElementById("content-output").innerHTML = `<div style="color: red; padding: 20px;">Markdown 解码错误: ${err.message}</div>`;
    }
    
    // Parse Markdown by splitting at '# Part '
    function parseSections() {
      const lines = rawMarkdown.split(/\r?\n/);
      const partsList = [];
      let currentPart = null;
      
      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        if (line.startsWith("# Part ") || (i === 0 && line.startsWith("# "))) {
          if (currentPart) {
            partsList.push(currentPart);
          }
          currentPart = {
            title: line.replace("# ", "").trim(),
            lines: []
          };
        } else {
          if (currentPart) {
            currentPart.lines.push(line);
          } else {
            currentPart = {
              title: "Intro",
              lines: [line]
            };
          }
        }
      }
      if (currentPart) {
        partsList.push(currentPart);
      }
      
      // Clean up empty lines
      partsList.forEach(p => {
        while(p.lines.length > 0 && p.lines[0].trim() === "") {
          p.lines.shift();
        }
      });
      
      // Navigation Icons mapping
      const iconsMap = {
        "Intro": "fa-circle-info",
        "Part 0": "fa-graduation-cap",
        "Part I": "fa-exchange-alt",
        "Part II": "fa-code",
        "Part III": "fa-bolt",
        "Part IV": "fa-robot",
        "Part V": "fa-microchip",
        "Part VI": "fa-circle-question"
      };
      
      // Convert to sections
      sections = partsList.map(part => {
        let icon = "fa-book-open";
        for (const [key, value] of Object.entries(iconsMap)) {
          if (part.title.startsWith(key)) {
            icon = value;
            break;
          }
        }
        return {
          title: part.title,
          icon: icon,
          parts: [part]
        };
      });
    }
    
    // Build Sidebar Navigation
    function buildSidebar() {
      const navList = document.getElementById("nav-list");
      navList.innerHTML = "";
      
      sections.forEach((sec, idx) => {
        const li = document.createElement("li");
        li.className = "nav-item" + (idx === activeSectionIndex ? " active" : "");
        li.onclick = () => selectSection(idx);
        
        li.innerHTML = `
          <i class="fa-solid ${sec.icon} nav-icon"></i>
          <span class="nav-text" title="${sec.title}">${sec.title}</span>
        `;
        navList.appendChild(li);
      });
    }
    
    // Select and display a section
    function selectSection(index) {
      activeSectionIndex = index;
      
      const items = document.querySelectorAll(".nav-item");
      items.forEach((item, idx) => {
        if (idx === index) item.classList.add("active");
        else item.classList.remove("active");
      });
      
      const sec = sections[index];
      document.getElementById("section-subtitle").innerText = `CHAPTER ${index + 1} OF ${sections.length}`;
      document.getElementById("section-title").innerText = sec.title;
      
      renderContent(sec);
      
      document.getElementById("content-viewport").scrollTop = 0;
      document.getElementById("prev-btn").disabled = (index === 0);
      document.getElementById("next-btn").disabled = (index === sections.length - 1);
    }
    
    // Render Markdown + Accordion for interview questions
    function renderContent(sec) {
      const output = document.getElementById("content-output");
      output.innerHTML = "";
      
      const container = document.createElement("div");
      
      sec.parts.forEach(part => {
        const partDiv = document.createElement("div");
        partDiv.className = "part-section";
        
        const partBody = document.createElement("div");
        partBody.className = "part-body-in-page";
        
        const lines = part.lines;
        const isQA = part.title.includes("Part VI");
        
        if (interviewMode && isQA) {
          const blocks = [];
          let currentBlock = null;
          
          for (let i = 0; i < lines.length; i++) {
            const line = lines[i];
            if (/^### Q\d+[:：]/.test(line)) {
              if (currentBlock) blocks.push(currentBlock);
              currentBlock = {
                question: line.replace("### ", "").trim(),
                answerLines: []
              };
            } else {
              if (currentBlock) {
                currentBlock.answerLines.push(line);
              } else {
                blocks.push({
                  intro: true,
                  lines: [line]
                });
              }
            }
          }
          if (currentBlock) blocks.push(currentBlock);
          
          blocks.forEach(b => {
            if (b.intro) {
              const div = document.createElement("div");
              div.innerHTML = marked.parse(b.lines.join("\n"));
              partBody.appendChild(div);
            } else {
              const qaBox = document.createElement("div");
              qaBox.className = "qa-box";
              
              const qHeader = document.createElement("div");
              qHeader.className = "qa-question";
              qHeader.innerHTML = `
                <div class="qa-question-content">
                  <i class="fa-solid fa-circle-question" style="color: var(--accent-violet);"></i>
                  <span>${b.question}</span>
                </div>
                <i class="fa-solid fa-chevron-right qa-arrow-icon"></i>
              `;
              qHeader.onclick = () => qaBox.classList.toggle("expanded");
              
              const aContent = document.createElement("div");
              aContent.className = "qa-answer";
              aContent.innerHTML = marked.parse(b.answerLines.join("\n"));
              
              qaBox.appendChild(qHeader);
              qaBox.appendChild(aContent);
              partBody.appendChild(qaBox);
            }
          });
        } else {
          partBody.innerHTML = marked.parse(lines.join("\n"));
        }
        
        partDiv.appendChild(partBody);
        container.appendChild(partDiv);
      });
      
      output.appendChild(container);
      postRenderCleanup();
    }
    
    // Post render styling and syntax highlights
    function postRenderCleanup() {
      // 1. Wrap tables in responsive div
      const tables = document.querySelectorAll("table");
      tables.forEach(table => {
        if (table.parentNode.classList.contains("table-wrapper")) return;
        
        const wrapper = document.createElement("div");
        wrapper.className = "table-wrapper";
        table.parentNode.insertBefore(wrapper, table);
        wrapper.appendChild(table);
      });

      // 2. Wrap code blocks with nice headers and copy buttons
      const preBlocks = document.querySelectorAll("pre");
      preBlocks.forEach(pre => {
        const code = pre.querySelector("code");
        if (!code) return;
        
        let lang = "code";
        const classes = code.className.split(" ");
        const langClass = classes.find(c => c.startsWith("language-"));
        if (langClass) {
          lang = langClass.replace("language-", "");
        }
        
        const container = document.createElement("div");
        container.className = "code-container";
        
        const header = document.createElement("div");
        header.className = "code-header";
        header.innerHTML = `
          <span class="code-lang">${lang.toUpperCase()}</span>
          <button class="copy-btn" onclick="copyCode(this)"><i class="fa-regular fa-copy"></i> Copy</button>
        `;
        
        pre.parentNode.insertBefore(container, pre);
        container.appendChild(header);
        container.appendChild(pre);
        
        Prism.highlightElement(code);
      });
      
      // 3. LaTeX Math equations rendering
      renderMathInElement(document.getElementById("content-output"), {
        delimiters: [
          {left: '$$', right: '$$', display: true},
          {left: '$', right: '$', display: false},
          {left: '\\(', right: '\\)', display: false},
          {left: '\\[', right: '\\]', display: true}
        ],
        throwOnError: false
      });
    }
    
    // Copy function helper
    function copyCode(btn) {
      const container = btn.closest(".code-container");
      const pre = container.querySelector("pre");
      const code = pre.querySelector("code");
      
      navigator.clipboard.writeText(code.innerText).then(() => {
        btn.innerHTML = `<i class="fa-solid fa-check" style="color: #10b981;"></i> Copied!`;
        setTimeout(() => {
          btn.innerHTML = `<i class="fa-regular fa-copy"></i> Copy`;
        }, 2000);
      });
    }
    
    // Search filter across titles & body text
    function handleSearch(query) {
      const q = query.toLowerCase().trim();
      const items = document.querySelectorAll(".nav-item");
      
      sections.forEach((sec, idx) => {
        let match = sec.title.toLowerCase().includes(q);
        if (!match) {
          match = sec.parts.some(part => 
            part.title.toLowerCase().includes(q) || 
            part.lines.join(" ").toLowerCase().includes(q)
          );
        }
        
        if (q === "" || match) {
          items[idx].style.display = "flex";
        } else {
          items[idx].style.display = "none";
        }
      });
    }
    
    // Event listeners initial setups
    document.addEventListener("DOMContentLoaded", () => {
      parseSections();
      buildSidebar();
      selectSection(0);
      
      document.getElementById("prev-btn").onclick = () => {
        if (activeSectionIndex > 0) selectSection(activeSectionIndex - 1);
      };
      document.getElementById("next-btn").onclick = () => {
        if (activeSectionIndex < sections.length - 1) selectSection(activeSectionIndex + 1);
      };
      
      const sidebar = document.getElementById("sidebar");
      const collapseBtn = document.getElementById("collapse-btn");
      collapseBtn.onclick = () => {
        isCollapsed = !isCollapsed;
        sidebar.classList.toggle("collapsed", isCollapsed);
        
        const icon = collapseBtn.querySelector("i");
        if (isCollapsed) {
          icon.className = "fa-solid fa-angle-right";
          collapseBtn.title = "展开侧边栏";
        } else {
          icon.className = "fa-solid fa-angle-left";
          collapseBtn.title = "收起侧边栏";
        }
      };
      
      const searchBox = document.getElementById("search-box");
      searchBox.onkeyup = (e) => handleSearch(e.target.value);
      
      const themeBtn = document.getElementById("theme-btn");
      const themeIcon = document.getElementById("theme-icon");
      themeBtn.onclick = () => {
        isDark = !isDark;
        document.body.classList.toggle("light-theme", !isDark);
        
        if (isDark) {
          themeIcon.className = "fa-solid fa-sun";
          themeIcon.style.color = "var(--text-secondary)";
        } else {
          themeIcon.className = "fa-solid fa-moon";
          themeIcon.style.color = "var(--accent-violet)";
        }
      };
      
      const interviewBtn = document.getElementById("interview-mode-btn");
      interviewBtn.onclick = () => {
        interviewMode = !interviewMode;
        interviewBtn.classList.toggle("active", interviewMode);
        selectSection(activeSectionIndex);
      };
      
      document.getElementById("about-btn").onclick = () => {
        alert("Python & AI/ML Interview Cheatsheet Viewer\n\n- 左侧面板支持快速折叠与搜索过滤\n- 右上角「模拟面试」按钮可开启 Q&A 复习自测模式\n- 底端支持深浅色主题切换和极速前后翻页");
      };
    });
  </script>
</body>
</html>
